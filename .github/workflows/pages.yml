name: Publish banner proof sheet

# Serves banners/ at https://nerdgr8.github.io/swingtribe-release-media/ so the
# proof sheet is a page anyone can open rather than a 2.8 MB file they have to
# download and trust. Every artwork file ships alongside it, which is what
# makes the per-plate filename links in the sheet resolve.
#
# Deliberately scoped to banners/. Publishing the repo root would put pr-*/
# under a second public URL for no gain: those images already have stable
# raw.githubusercontent.com links, and index.json points at those.

on:
  push:
    branches: [main]
    paths:
      - 'banners/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: Pages serves whatever finished last, so a
# cancelled run can leave the site older than the commit that triggered it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on the first time this runs, so nobody has
      # to find the setting. It is a no-op on every run after that.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Check every sheet and its files agree
        run: |
          # Every per-plate link must resolve to a file that is actually here.
          # A rebuild that renames a board would otherwise publish a page full
          # of 404s and look fine until somebody clicked.
          #
          # Every sheet, not just the top one: the golf day pack is its own
          # page with 25 links of its own, and checking banners/index.html
          # alone left all of them unchecked. Links are relative to the sheet
          # that carries them, so each is resolved against its own directory.
          missing=0
          total=0
          for sheet in $(find banners -name index.html | sort); do
            dir=$(dirname "$sheet")
            grep -o 'class="slug" href="[^"]*"' "$sheet" \
              | sed 's/.*href="//; s/"$//' | sort -u > /tmp/links.txt
            n=$(wc -l < /tmp/links.txt)
            total=$((total + n))
            while read -r f; do
              if [ ! -f "$dir/$f" ]; then echo "::error::missing $dir/$f"; missing=1; fi
            done < /tmp/links.txt
            echo "$sheet: $n links"
          done
          echo "checked $total links across every sheet"
          exit $missing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: banners

      - id: deployment
        uses: actions/deploy-pages@v4
